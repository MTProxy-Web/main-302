<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Redirect</title>
</head>
<body>
  <noscript>Включите JavaScript для перехода.</noscript>
  <script>
    const pool = JSON.parse(atob('eyJkb21haW4iOiJtdHByb3h5LmJhciIsImxhYmVscyI6WyJ2ZWxvcmEiLCJ0ZXBhbSIsImtvbGVzIiwidm9sYXIiLCJkaWJ1ZyJdfQ=='));
    const random = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / pool.labels.length) * pool.labels.length;
    do {
      crypto.getRandomValues(random);
    } while (random[0] >= limit);
    const target = new URL('https://' + pool.labels[random[0] % pool.labels.length] + '.' + pool.domain + '/');
    const search = window.location.search.slice(1).split('&').filter(part => part.split('=', 1)[0] !== '_mtproxy_refresh').join('&');
    target.search = search ? '?' + search : '';
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</body>
</html>
